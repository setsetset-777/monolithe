services:
  astro:
    build:
      context: .
      dockerfile: docker/.Dockerfile.pnpm
    working_dir: /workspace
    command: ['pnpm', '--filter', '@monolithe/astro', 'dev', '--port', '${SERVER_PORT}', '--host']
    ports:
      - '${SERVER_PORT:-3000}:${SERVER_PORT:-3000}'
    volumes:
      - ./:/workspace
      - pnpm_store:/pnpm/store
      - node_modules:/workspace/node_modules
      # - /workspace/apps/astro/.astro
    tmpfs:
      - /workspace/apps/astro/.astro
    env_file:
      - .env
    stop_grace_period: 1s
    networks:
      - monolithe

  payload:
    build:
      context: .
      dockerfile: docker/.Dockerfile.pnpm
    working_dir: /workspace
    command: ['pnpm', '--filter', '@monolithe/payload', 'dev']
    ports:
      - '${PAYLOAD_PORT:-3001}:${PAYLOAD_PORT:-3001}'
    volumes:
      - ./:/workspace
      - media:/workspace/media
      - pnpm_store:/pnpm/store
      - node_modules:/workspace/node_modules
    depends_on:
      mongo:
        condition: service_started
    env_file:
      - .env
    networks:
      - monolithe

  # Ensure your DATABASE_URI uses 'mongo' as the hostname ie. mongodb://mongo/my-db-name
  mongo:
    image: mongo:latest
    # container_name: monolithe-mongo
    ports:
      - '${MONGO_PORT:-27017}:${MONGO_PORT:-27017}'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none
    networks:
      - monolithe

networks:
  monolithe:
    name: monolithe

volumes:
  data:
  pnpm_store:
  node_modules:
  media:
